{% extends 'base.html' %}
{% block content %}
<section class="auth-section">
  <form method="post" class="auth-card slide-up">
    <h2>Welcome Back</h2>
    <p>Login to add plantations and view your eco dashboard.</p>
    <label>Email or Username <input type="text" name="identifier" required></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn" type="submit">Login</button>
  </form>
</section>
{% endblock %}
